<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Trigger Deployment Events</h1>
    <div class="btn-group">
        <button class="btn-success" onclick="showToast('success')">Pipeline Success</button>
        <button class="btn-warning" onclick="showToast('warning')">High CPU Alert</button>
        <button class="btn-danger" onclick="showToast('danger')">Pod Crash</button>
    </div>
    <div class="toast-container" id="toastContainer"></div>
    <script src="app.js"></script>
</body>
</html>
